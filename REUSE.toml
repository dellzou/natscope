# 不在这里重复声明。
version = 1

SPDX-PackageName = "NatScope"
SPDX-PackageSupplier = "ZouNing (https://github.com/dellzou)"
SPDX-PackageDownloadLocation = "https://github.com/dellzou/NatScope"
SPDX-PackageComment = "NAT 类型检测工具（RFC 3489 / RFC 5780 / UPnP / NAT-PMP / PCP）"

[[annotations]]
path = "assets/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 ZouNing"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"

[[annotations]]
path = "docs/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 ZouNing"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"

[[annotations]]
path = "**/*.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 ZouNing"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"

[[annotations]]
path = "**/*.toml"
precedence = "override"
SPDX-FileCopyrightText = "2026 ZouNing"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"

[[annotations]]
path = "**/*.yml"
precedence = "override"
SPDX-FileCopyrightText = "2026 ZouNing"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"

[[annotations]]
path = "**/*.spec"
precedence = "override"
SPDX-FileCopyrightText = "2026 ZouNing"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"

[[annotations]]
