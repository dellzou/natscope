name: release-notes

# 只更新 Release 正文，不重新构建、不碰已发布的二进制。
# 目的：改文案不应该让用户重新下载，也不应该让已验收的 sha256 失效。

on:
  push:
    branches: [main]
    paths:
      - "docs/v1.1-release-notes.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update release body via REST
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.1.0"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}"
                -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")

          # 用 Python 生成 JSON，避免多行正文在 shell 里的转义问题
          python3 - <<'PY'
          import json, pathlib
          body = pathlib.Path("docs/v1.1-release-notes.md").read_text(encoding="utf-8")
          pathlib.Path("body.json").write_text(json.dumps({"body": body}), encoding="utf-8")
          print(f"body chars: {len(body)}")
          PY

          # 先按 tag 取 id —— PATCH 只能打在 /releases/{id} 上，
          # /releases/tags/{tag} 只有 GET，打 PATCH 会 404。
          curl -sS "${AUTH[@]}" "${API}/releases/tags/${TAG}" -o rel.json -w "get=%{http_code}\n"
          RID=$(python3 -c "import json;print(json.load(open('rel.json')).get('id',''))")
          if [ -z "$RID" ]; then echo "取不到 release id"; exit 1; fi
          echo "release id=$RID"

          # 只 PATCH body，其余字段一个都不传
          curl -sS -X PATCH "${AUTH[@]}" --data-binary @body.json \
            "${API}/releases/${RID}" -o resp.json -w "http=%{http_code}\n"

          python3 - <<'PY'
          import json, pathlib, sys
          d = json.loads(pathlib.Path("resp.json").read_text(encoding="utf-8"))
          if "id" not in d:
              sys.exit(f"更新失败: {d.get('message')}")
          n = len(d.get("body") or "")
          asset = [a for a in d.get("assets", []) if a["name"] == "NatScope.exe"]
          print(f"release id={d['id']} body_len={n} assets={len(d.get('assets', []))}")
          for a in asset:
              print(f"asset {a['name']} {a['size']} {a.get('digest')}")
          if n == 0:
              sys.exit("body 回读为空，更新没生效")
          if not asset:
              sys.exit("资产不见了，需要人工检查")
          PY
