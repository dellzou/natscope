name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build single-file exe
        run: pyinstaller natscope.spec --noconfirm --clean

      - name: Show build output
        run: |
          dir dist
          (Get-Item dist\NatScope.exe).Length / 1MB

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NatScope-exe
          path: dist/NatScope.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # 全部走 REST，不走 gh CLI：gh 失败时最后一句 Write-Host 会把退出码
          # 盖成 0，导致「Release 没建出来但 job 是绿的」。每一步都显式校验。
          $ErrorActionPreference = "Stop"
          $repo = "${{ github.repository }}"
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF -replace "^refs/tags/", ""
          } else {
            git describe --tags --abbrev=0
          }
          $api = "https://api.github.com/repos/$repo"
          $headers = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            Accept                 = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Write-Host "Releasing $tag"

          $release = $null
          try {
            $release = Invoke-RestMethod -Uri "$api/releases/tags/$tag" -Headers $headers -Method Get
            Write-Host "现有的 release id=$($release.id)，复用"
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
            $body = @{
              tag_name   = $tag
              name       = "NatScope $tag"
              draft      = $false
              prerelease = $false
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Uri "$api/releases" -Headers $headers -Method Post `
              -Body $body -ContentType "application/json; charset=utf-8"
            Write-Host "已创建 release id=$($release.id)"
          }
          if (-not $release) { throw "release 创建失败，中止" }

          # 传资产。已存在同名资产先删掉（REST 不能 overwrite）。
          foreach ($a in $release.assets) {
            if ($a.name -eq "NatScope.exe") {
              Invoke-RestMethod -Uri "$api/releases/assets/$($a.id)" -Headers $headers -Method Delete
              Write-Host "删除旧资产 $($a.id)"
            }
          }
          $uploadUrl = ($release.upload_url -replace "\{.*\}$", "") + "?name=NatScope.exe"
          $upHeaders = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            Accept                 = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $asset = Invoke-RestMethod -Uri $uploadUrl -Headers $upHeaders -Method Post `
            -ContentType "application/octet-stream" -InFile "dist/NatScope.exe"
          Write-Host "已上传资产 $($asset.name) $($asset.size) bytes"

          # 回读校验，确认线上真的有
          $check = Invoke-RestMethod -Uri "$api/releases/tags/$tag" -Headers $headers -Method Get
          $live = $check.assets | Where-Object { $_.name -eq "NatScope.exe" }
          if (-not $live) { throw "上传后回读不到资产" }
          if ($live.size -ne (Get-Item "dist/NatScope.exe").Length) {
            throw "资产大小不符：线上 $($live.size)，本地 $((Get-Item 'dist/NatScope.exe').Length)"
          }
          Write-Host "校验通过：$($live.name) $($live.size) bytes"
          Write-Host "Release ready: $($check.html_url)"
